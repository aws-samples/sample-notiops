[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NotiOpsWebChat"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.19.0",
    "strands-agents >= 1.15.0",
    # 安全:解析 AWS RSS feed 用 defusedxml 防 XXE(见 core/whats_new.py)
    "defusedxml >= 0.7.1",
    # GPT-5.4 via Bedrock Mantle（OpenAI Responses API）所需
    "openai >= 1.50.0",
    "aws-bedrock-token-generator",
    # FinOps：官方 awslabs MCP（进程内 stdio 子进程；只读工具白名单见 core/finops_mcp.py）
    "awslabs.aws-pricing-mcp-server >= 1.0.31",
    "awslabs.billing-cost-management-mcp-server >= 0.0.24",
    # 故障调查：官方 awslabs MCP（进程内 stdio；只读白名单见 core/investigation_mcp.py）
    "awslabs.cloudwatch-mcp-server >= 0.1.4",
    "awslabs.cloudtrail-mcp-server >= 0.0.15",
    # 云上查询兜底：官方 awslabs aws-api-mcp-server（进程内 stdio；READ_OPERATIONS_ONLY=true，
    # 任意 AWS 只读 API 长尾兜底；见 core/aws_api_mcp.py）
    "awslabs.aws-api-mcp-server >= 1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
