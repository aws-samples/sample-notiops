<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" role="img" aria-label="NotiOps">
  <!-- Logo A — Notification pulse: rounded-square mark, bold N, pulse dot as the alert -->
  <defs>
    <linearGradient id="a-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#ec7211"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="52" height="52" rx="13" fill="url(#a-grad)"/>
  <!-- N: left stem up, diagonal down, right stem up -->
  <path d="M16 40 L16 18 L40 40 L40 18"
        fill="none" stroke="#ffffff" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pulse dot at the top of the right stem (the "Noti") -->
  <circle cx="40" cy="15" r="7.5" fill="url(#a-grad)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="40" cy="15" r="3" fill="#ffffff"/>
</svg>
