AWSTemplateFormatVersion: "2010-09-09"

# 🔴 **所有 `Description:` 字段必须是纯 ASCII 英文。**
#
# 2026-08-26 实测：CloudFormation 把 Description 里的非 ASCII 全部渲染成 `?`，
# 客户在「快速创建堆栈」页上看到的是一屏问号 —— 看不出模板建什么、参数填什么，
# 而且不报错。（先怀疑是 S3 content-type 少 charset=utf-8，加上仍是问号，
# 所以是 CFN 服务端行为。）
#
# ⚠️ 这个模板**给客户看**（跨账号接入时客户在自己账号里点开部署），客户可能是
#    任何语言环境，所以英文也是对的。中文判据留在 `#` 注释里，不进 CFN。
#
# 中文原文（本模板做什么）：
#   在业务账号内创建 NotiOps 多账号接入所需的全部资源：
#   1. notiops-idle-detection-role — 系统账号跨账号只读采集角色
#      （RDS/ElastiCache/CW/TA/CE/COH 等）——**巡检采集就靠它**
#   2. DevOps Agent 事件转发 — EventBridge Rule + Role，把 aws.aidevops
#      调查事件转发到系统账号 Custom Bus
#   3. (可选) PHD 事件转发 — 把 AWS Health 事件转发到系统账号 SNS Topic
#   4. (可选) CloudWatch OAM Link — 把 metrics/logs/traces 共享给管理账号
#   通过 StackSets 从管理账号批量下发；也可在单个业务账号手动部署。
Description: >
  NotiOps member-account onboarding (StackSet payload). Creates everything
  NotiOps needs to inspect and investigate this account from the management
  account:
  (1) a cross-account READ-ONLY role the management account assumes to collect
  RDS / ElastiCache / CloudWatch / Trusted Advisor / Cost data - resource
  inspection depends on this role;
  (2) optionally, an EventBridge rule + role that forwards AWS DevOps Agent
  investigation events to the management account's custom event bus;
  (3) optionally, forwarding of AWS Health (PHD) events to a management-account
  SNS topic;
  (4) optionally, a CloudWatch OAM link sharing metrics/logs/traces.
  Deployed via StackSets (service-managed) from the management account, or
  manually in a single account (aws cloudformation deploy).
  No write permissions are granted to any resource in this account.

Parameters:
  SystemAccountId:
    Type: String
    # 中文：NotiOps 系统部署账号 ID（12 位数字）
    Description: >
      Account id of the NotiOps deployment (the management account). The
      read-only role created here will trust this account.
    AllowedPattern: "[0-9]{12}"
    ConstraintDescription: Must be a 12-digit AWS account ID

  OrganizationId:
    Type: String
    Default: ""
    # 中文：(可选但强烈建议) AWS Organizations ID (o-xxxx)。非空时给跨账号信任策略加
    #       aws:PrincipalOrgID 条件做纵深防御：即便信任了系统账号 root，也只有本组织内的
    #       principal 能 AssumeRole，杜绝跨组织混淆代理（confused deputy）。
    # ⚠️ 跨 Org 接入时**必须留空** —— 填了条件永远不成立，AssumeRole 全部被拒。
    Description: >
      Optional but recommended when this account is in the SAME AWS Organization
      as the NotiOps deployment: the organization id (o-xxxx). It adds an
      aws:PrincipalOrgID condition to the trust policies as defense in depth
      against the confused-deputy problem.
      LEAVE EMPTY if this account is in a different organization - otherwise the
      condition can never be satisfied and every AssumeRole will be denied.
    AllowedPattern: "^(o-[a-z0-9]{10,32})?$"
    ConstraintDescription: Must be an AWS Organizations ID (o-xxxx) or empty

  DevOpsEventBusArn:
    Type: String
    Default: ""
    Description: >
      Optional. ARN of the custom EventBridge bus in the management account that
      DevOps Agent investigation events are forwarded to.
      Example: arn:aws:events:ap-northeast-1:123456789012:event-bus/notiops-devops-events
      Leave empty to skip the forwarding rule entirely - the one-click
      (Web Chat only) deployment has no such bus and no callback Lambda
      consuming it, so it only needs the cross-account read-only role below.
    AllowedPattern: "^(arn:aws:events:[a-z0-9-]+:[0-9]{12}:event-bus/.+)?$"
    ConstraintDescription: Must be a valid EventBridge event bus ARN, or empty

  PhdSnsTopicArn:
    Type: String
    Default: ""
    # 中文：(可选) 系统账号 PHD SNS Topic ARN。留空则不部署 PHD 转发。
    Description: >
      Optional. ARN of the management-account SNS topic that AWS Health (PHD)
      events are forwarded to. Leave empty to skip PHD forwarding.
      Example: arn:aws:sns:ap-northeast-1:123456789012:phd-events

  ObservabilitySinkArn:
    Type: String
    Default: ""
    # 中文：(可选) 管理账号 CloudWatch OAM Sink ARN。非空时创建 oam:Link，把本账号
    #       metrics/logs/traces 共享给管理账号（跨账号 observability / 调查关联分析）。
    Description: >
      Optional. ARN of a CloudWatch Observability Access Manager sink in the
      management account. When set, an OAM link is created so this account's
      metrics, logs and traces can be read cross-account. Leave empty to skip.

  PrimaryRegion:
    Type: String
    Default: "us-east-1"
    # 中文：主 Region（=系统部署 Region）。IAM 角色是全局资源，只在主 Region 的
    #       stack instance 创建；其余 Region 的 instance 只创建 EventBridge 转发规则
    #       （引用同名角色 ARN）。借此同一 StackSet 可按账号多 Region 下发。
    Description: >
      The region where NotiOps is deployed. IAM roles are global, so they are
      created only by the stack instance in this region; instances in other
      regions create just the EventBridge forwarding rules and reference the
      same role. Set this to the NotiOps deployment region.

Conditions:
  EnableOamLink: !And
    - !Not [!Equals [!Ref ObservabilitySinkArn, ""]]
    - !Condition IsPrimaryRegion  # v1 先主 Region；如需多 Region link 去掉本条件逐区下发
  EnablePhdForwarding: !And
    - !Not [!Equals [!Ref PhdSnsTopicArn, ""]]
    - !Condition IsPrimaryRegion  # EventBridge→SNS Target 仅支持同 Region，PHD 转发只在主 Region
  # 转发角色是 IAM(全局)，只在主 Region 建；转发规则每个 Region 都要（跨 Region 事件也要回总线）。
  EnableDevOpsForwardRole: !And
    - !Not [!Equals [!Ref DevOpsEventBusArn, ""]]
    - !Condition IsPrimaryRegion
  EnableDevOpsForwarding: !Not [!Equals [!Ref DevOpsEventBusArn, ""]]
  IsPrimaryRegion: !Equals [!Ref "AWS::Region", !Ref PrimaryRegion]
  HasOrgId: !Not [!Equals [!Ref OrganizationId, ""]]

Resources:
  # ─── 1. 跨账号只读采集角色 ───
  # 权限与系统账号 notiops-backend-stack.ts 的 IdleDetectionRole 保持一致。
  # 信任系统账号的 notiops-lambda-execution-role（lambda1/5、API、Web Chat BFF 共用）。
  # RoleName 带 SystemAccountId 后缀：与目标账号内可能存在的【独立 NotiOps 部署】
  # （其 NotiOpsBackendStack 拥有无后缀的 notiops-idle-detection-role）解耦共存，
  # 也支持同一成员账号被多个管理部署纳管。
  IdleDetectionRole:
    Type: AWS::IAM::Role
    Condition: IsPrimaryRegion
    Properties:
      RoleName: !Sub "notiops-idle-detection-role-${SystemAccountId}"
      Description: "Allows NotiOps system account read-only access to this member account (RDS/EC2/CloudWatch/Cost/Support/Security etc.)"
      # 挂 AWS 托管 ReadOnlyAccess：与部署账号自身 agent 的广只读范围对齐，
      # 让跨账号调查(EC2/成本/任意只读 API)与单账号体验一致。纯只读、无任何写权限。
      # 下方 inline notiops-readonly 保留：明确列出核心用到的 action(文档用途 + 兜底)。
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # 信任管理账号 root：由管理账号侧 IAM 精确控制哪些角色能 AssumeRole
              # （lambda 执行角色 + Web Chat BFF 角色均有显式 sts:AssumeRole 授权）。
              # 只信任单一角色名会漏掉 BFF（其 roleName 由 CDK 自动生成）。
              AWS: !Sub "arn:aws:iam::${SystemAccountId}:root"
            Action: sts:AssumeRole
            # 纵深防御：传入 OrganizationId 时，附加 aws:PrincipalOrgID 条件——
            # 即便信任 root，也只有本组织内的 principal 能 assume，杜绝跨组织混淆代理。
            Condition: !If
              - HasOrgId
              - StringEquals:
                  aws:PrincipalOrgID: !Ref OrganizationId
              - !Ref "AWS::NoValue"
      Policies:
        - PolicyName: notiops-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:ListTagsForResource
                  # 资源巡检的变更事件抑制（R2.5）：刚扩容/刚重启的实例本轮不报。
                  # 缺它巡检不会失败，但抑制条件恒不成立 —— 客户在维护窗口后
                  # 第一天会收到一批本该被压掉的告警。
                  # 注：rds:DescribeDBClusters 已在下方 EOS 那段声明（Aurora 巡检也用它）。
                  - rds:DescribeEvents
                  # 引擎 EOL 判定（结构性风险页）。缺它那一整类 finding
                  # 永远为空，而页面上与「没有 EOL 风险」无法区分。
                  - rds:DescribeDBMajorEngineVersions
                  # CA 证书到期规则。缺它那条规则永远不命中，而与「没有证书
                  # 风险」无法区分。RDS CA 到期是硬期限（到点连不上）。
                  - rds:DescribeCertificates
                  - elasticache:DescribeCacheClusters
                  - elasticache:DescribeReplicationGroups
                  - elasticache:DescribeEvents
                  - elasticache:ListTagsForResource
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - support:DescribeTrustedAdvisorCheckResult
                  - support:DescribeTrustedAdvisorChecks
                  # 仪表盘跨账号视角（Security / Cases / Health / Investigate）——
                  # 新增仪表盘需要的只读动作统一加在这里，StackSet 更新自动滚到全部成员账号
                  - securityhub:GetFindings
                  - securityhub:DescribeHub
                  - support:DescribeCases
                  - support:DescribeCommunications
                  - support:DescribeServices
                  - health:Describe*
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmHistory
                  # ④ GuardDuty / Backup 仪表盘（只读）
                  - guardduty:ListDetectors
                  - guardduty:GetFindingsStatistics
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                  - backup:ListBackupJobs
                  - backup:ListBackupVaults
                  - backup:ListProtectedResources
                  # Phase 2: 管理侧自动回填 DevOps Agent payload —— 读成员账号内
                  # notiops-member-devops-agent StackSet 实例的 outputs
                  - cloudformation:DescribeStacks
                  # Lifecycle/EOS 仪表盘跨账号扫描（版本生命周期盘点，全部只读）
                  - ec2:DescribeRegions
                  # 🔴 **内存类判定的分母。** `freeable_memory_pct` /
                  # `database_memory_usage_pct` 都是「占实例规格的百分比」
                  # （R2.1.2），分母来自 `ec2:DescribeInstanceTypes` 的
                  # `MemoryInfo.SizeInMiB`（RDS/EC 的规格名去掉 db./cache.
                  # 前缀就是 EC2 机型）。
                  #
                  # 缺它的表现：`resolved memory for 0/N instance types` →
                  # 全部 attrs 的 memory_bytes 留 None → **内存类规则一条都
                  # 不命中**，而看板上与「内存都很健康」完全无法区分。
                  # 整轮 status=success / completeness=100%，零错误码。
                  # 这一条是在真实账号上实测出来的（缺它 = 内存类规则全静默）。
                  #
                  # ⚠️ 这两份模板此前**都漏了它**（部署账号侧的 lambdaRole 有）。
                  # 多 region 之后那条 AccessDenied 会每轮重复 17 次 ——
                  # 后果没变，只是日志噪声乘上去了。
                  # ⚠️ 不支持资源级限定（API 要求 `*`）。只读、静态公共目录。
                  - ec2:DescribeInstanceTypes
                  - rds:DescribeDBClusters
                  - rds:DescribeDBEngineVersions
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - eks:DescribeClusterVersions
                  - lambda:ListFunctions
                  - es:ListDomainNames
                  - es:DescribeDomains
                  - elasticmapreduce:ListClusters
                  - elasticmapreduce:DescribeCluster
                  - ce:Get*
                  - ce:List*
                  - ce:Describe*
                  - cost-optimization-hub:ListRecommendations
                  - cost-optimization-hub:GetRecommendation
                  - cost-optimization-hub:ListEnrollmentStatuses
                  - cost-optimization-hub:GetPreferences
                  - compute-optimizer:Get*
                  - compute-optimizer:Describe*
                  - budgets:ViewBudget
                  - budgets:DescribeBudgets
                  - pricing:GetProducts
                  - pricing:DescribeServices
                  - pricing:GetAttributeValues
                  - pricing:ListPriceLists
                  - pricing:GetPriceListFileUrl
                  - freetier:GetFreeTierUsage
                  - storagelens:Get*
                  - storagelens:List*
                  - s3:GetStorageLensConfiguration
                  - s3:ListStorageLensConfigurations
                  - cur:DescribeReportDefinitions
                Resource: "*"

  # ─── 2. (可选) DevOps Agent 调查事件转发 ───
  # DevOpsEventBusArn 留空 = 跳过整块（一键部署路径：系统账号没有这条总线）。
  DevOpsEventsForwardRole:
    Type: AWS::IAM::Role
    Condition: EnableDevOpsForwardRole
    Properties:
      RoleName: !Sub "notiops-devops-forwarder-role-${AWS::AccountId}"
      Description: "Allow EventBridge to forward aws.aidevops events to NotiOps system account custom bus"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: put-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Ref DevOpsEventBusArn

  DevOpsEventsForwardRule:
    Type: AWS::Events::Rule
    Condition: EnableDevOpsForwarding
    Properties:
      Name: notiops-devops-events-forward
      Description: "Forward DevOps Agent investigation events to NotiOps system account"
      EventPattern:
        source:
          - aws.aidevops
        detail-type:
          - "Investigation Created"
          - "Investigation Completed"
          - "Investigation Failed"
          - "Investigation Timed Out"
          - "Investigation Cancelled"
          - "Investigation Linked"
          # SKIPPED 是终态且**不该重投**（重投必然同样结果）。
          # 判据取自官方文档的 detail-type 清单 —— EventBridge schema registry
          # 里没有 InvestigationSkipped（registry 滞后）。
          - "Investigation Skipped"
      Targets:
        - Arn: !Ref DevOpsEventBusArn
          Id: notiops-devops-bus-target
          # 构造 ARN 而非 GetAtt：角色只在主 Region 创建，非主 Region 的规则按固定命名引用
          RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/notiops-devops-forwarder-role-${AWS::AccountId}"

  # ─── 3. (可选) PHD 事件转发 ───
  # 与 infra/phd-event-forwarder.yaml 等价；RoleName 保持同一约定,
  # 便于系统账号 SNS Topic Policy 按 ArnLike phd-event-forwarder-role-* 放行。
  PhdEventsForwardRole:
    Type: AWS::IAM::Role
    Condition: EnablePhdForwarding
    Properties:
      RoleName: !Sub "phd-event-forwarder-role-${AWS::AccountId}"
      Description: "Allow EventBridge to publish PHD events to cross-account SNS Topic"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sns-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref PhdSnsTopicArn

  PhdEventsForwardRule:
    Type: AWS::Events::Rule
    Condition: EnablePhdForwarding
    Properties:
      Name: notiops-phd-events-forward
      Description: "Forward PHD events to NotiOps system account SNS Topic"
      EventPattern:
        source:
          - aws.health
        detail-type:
          - "AWS Health Event"
      Targets:
        - Arn: !Ref PhdSnsTopicArn
          Id: phd-sns-target
          RoleArn: !GetAtt PhdEventsForwardRole.Arn

  ObservabilityLink:
    Type: AWS::Oam::Link
    Condition: EnableOamLink
    Properties:
      SinkIdentifier: !Ref ObservabilitySinkArn
      ResourceTypes:
        - AWS::CloudWatch::Metric
        - AWS::Logs::LogGroup
        - AWS::XRay::Trace
      LabelTemplate: "$AccountName"

Outputs:
  IdleDetectionRoleArn:
    Condition: IsPrimaryRegion
    # 中文：跨账号只读角色 ARN（登记到系统账号目标账户配置的 role_arn）
    Description: >
      ARN of the cross-account read-only role. NotiOps registers this so
      resource inspection can assume it. You normally do not need to copy it
      manually - the admin page derives it and verifies with a real AssumeRole.
    Value: !GetAtt IdleDetectionRole.Arn
